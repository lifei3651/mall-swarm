server:
  # 默认仅允许本机联调；容器正式部署会显式覆盖为 0.0.0.0，并由内部网络与 Nginx 保护。
  address: 127.0.0.1
  port: 8086
  error:
    # 所有环境统一隐藏异常、绑定错误和堆栈；详细原因只进入服务端日志。
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false
  compression:
    # Nginx 已开启 gzip；这里作为直连后端、测试环境和未来容器部署的兜底。
    enabled: true
    min-response-size: 1KB
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript,image/svg+xml

spring:
  application:
    name: mall-distribution
  task:
    scheduling:
      # 订单、奖金、ERP、监控和文件清理互不长期阻塞；分布式锁继续保证业务任务只执行一次。
      pool:
        size: ${SCHEDULING_POOL_SIZE:4}
      thread-name-prefix: mall-scheduler-
      shutdown:
        await-termination: true
        await-termination-period: 30s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: jdbc:mysql://localhost:3306/mall_distribution?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 3000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      connect-timeout: 2s
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2s
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yaml

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.macro.mall.distribution.entity
  configuration:
    map-underscore-to-camel-case: true
    # 资金和库存事务依赖每次查询看到最新状态；不跨语句复用一级缓存快照。
    local-cache-scope: statement
    cache-enabled: false

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

logging:
  level:
    com.macro.mall.distribution: info

admin:
  security:
    # 管理后台登录成功后的绝对有效期；到期后前后端都会强制重新登录。
    session-hours: 12

security:
  # 64位十六进制 AES-256 密钥；生产启动门禁强制要求，客户部署脚本自动生成。
  data-encryption-key: ${DATA_ENCRYPTION_KEY:}
  data-encryption:
    # 既有环境首次发布先保持 false 验证兼容性，再配置为 true 并迁移；客户新部署模板强制开启。
    write-enabled: ${DATA_ENCRYPTION_WRITE_ENABLED:false}
    migrate-on-startup: ${DATA_ENCRYPTION_MIGRATE_ON_STARTUP:true}
  cors:
    # 空值表示拒绝所有跨域请求；客户部署脚本会写入公开商城、团队H5和后台的精确HTTPS来源。
    allowed-origins: ${CORS_ORIGINS:}

# Sa-Token 配置
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  active-timeout: 1800
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

# 仅供本地联调；生产配置会强制关闭。
shop:
  catalog:
    # 商城基座默认足够大；客户确有大量行业分类时可通过环境变量调整，无需改代码。
    max-categories: ${SHOP_MAX_CATEGORIES:500}
  content:
    # 逗号分隔的客户违禁词词库；基座默认空，交付时按客户经营要求配置。
    blocked-terms: ${SHOP_CONTENT_BLOCKED_TERMS:}
  realtime:
    heartbeat-ms: ${SHOP_REALTIME_HEARTBEAT_MS:25000}
  logistics:
    # NONE 表示只展示物流公司和运单号；客户确定供应商后注册同名适配器并修改此项。
    tracking-provider: ${SHOP_LOGISTICS_TRACKING_PROVIDER:NONE}
  catalog-cache:
    enabled: true
    # 库存仍由下单事务实时校验；短 TTL 只用于公共展示，并在后台修改后立即失效。
    home-ttl-seconds: 30
    product-ttl-seconds: 15
    category-ttl-seconds: 60
  media:
    storage-dir: ${SHOP_MEDIA_STORAGE_DIR:/opt/lingqimall/uploads/products}
    private-storage-dir: ${SHOP_MEDIA_PRIVATE_STORAGE_DIR:/opt/lingqimall/uploads/private}
    max-dimension: ${SHOP_MEDIA_MAX_DIMENSION:1920}
    max-pixels: ${SHOP_MEDIA_MAX_PIXELS:25000000}
    jpeg-quality: ${SHOP_MEDIA_JPEG_QUALITY:0.82}
  payment:
    # 安全默认值：任何未显式选择 local/test 的部署都不能进入模拟支付。
    simulation-enabled: false
  withdrawal:
    # 团队H5基座默认风控；客户交付时可配置，拒绝单释放金额但仍计申请次数。
    daily-max-count: ${SHOP_WITHDRAWAL_DAILY_MAX_COUNT:5}
    monthly-max-count: ${SHOP_WITHDRAWAL_MONTHLY_MAX_COUNT:50}
    daily-max-amount: ${SHOP_WITHDRAWAL_DAILY_MAX_AMOUNT:100000.00}
    monthly-max-amount: ${SHOP_WITHDRAWAL_MONTHLY_MAX_AMOUNT:1000000.00}
  order:
    pending-timeout-minutes: 30
    pending-scan-interval-ms: 60000
  after-sale:
    # 0表示不自动关闭；客户交付时可按售后制度调整。
    return-shipment-timeout-days: 7
    return-shipment-scan-interval-ms: 600000
payment:
  verification:
    enabled: false
    threshold: 500
sms:
  provider-enabled: false
  # 安全默认值：固定验证码只允许由 local/test profile 显式开启。
  expose-code: false
  test-code: ""

bonus:
  settlement:
    cooling-off-days: 7
    scan-interval-ms: 600000
  calculation:
    scan-interval-ms: ${BONUS_CALCULATION_SCAN_INTERVAL_MS:5000}

order:
  balance-allocation:
    remainder-account: SYSTEM_REMAINDER
    product-cost-account: SYSTEM_PRODUCT_COST

erp:
  sync:
    # ERP推单连续失败达到该次数后停止自动重试，后台仍可人工重试。
    max-retries: ${ERP_SYNC_MAX_RETRIES:8}
    scan-interval-ms: ${ERP_SYNC_SCAN_INTERVAL_MS:60000}

operation-log:
  # 后台审计日志默认保留一年，服务层会强制保证不少于90天。
  retention-days: ${OPERATION_LOG_RETENTION_DAYS:365}
  # 每天低峰期分批清理过期记录；多实例部署由分布式任务锁避免重复执行。
  cleanup-cron: "${OPERATION_LOG_CLEANUP_CRON:0 30 3 * * ?}"

# 接口文档默认关闭；仅显式 local 配置可开启。本地/测试也只暴露最小健康信息。
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

database:
  monitor:
    slow-query-ms: ${DB_SLOW_QUERY_MS:1000}
    row-warning-threshold: ${DB_ROW_WARNING_THRESHOLD:1000000}
    size-warning-mb: ${DB_SIZE_WARNING_MB:2048}
    pool-warning-percent: ${DB_POOL_WARNING_PERCENT:80}
    pool-sample-ms: ${DB_POOL_SAMPLE_MS:15000}
    pool-initial-delay-ms: ${DB_POOL_INITIAL_DELAY_MS:60000}
    capacity-cron: "${DB_CAPACITY_MONITOR_CRON:0 15 3 * * ?}"

cache:
  monitor:
    sample-ms: ${CACHE_MONITOR_SAMPLE_MS:15000}
    initial-delay-ms: ${CACHE_MONITOR_INITIAL_DELAY_MS:60000}

# 支付宝支付配置
# 正式使用时请替换为真实的支付宝应用配置
alipay:
  enabled: ${ALIPAY_ENABLED:false}
  appId: ${ALIPAY_APP_ID:}
  sellerId: ${ALIPAY_SELLER_ID:}
  privateKey: ${ALIPAY_PRIVATE_KEY:}
  alipayPublicKey: ${ALIPAY_PUBLIC_KEY:}
  notifyUrl: ${ALIPAY_NOTIFY_URL:https://lingqimall.com/api/pay/alipay/notify}
  returnUrl: ${ALIPAY_RETURN_URL:https://lingqimall.com/api/pay/alipay/return}
  gatewayUrl: https://openapi.alipay.com/gateway.do
  signType: RSA2
  connectTimeoutMs: ${ALIPAY_CONNECT_TIMEOUT_MS:5000}
  readTimeoutMs: ${ALIPAY_READ_TIMEOUT_MS:10000}
