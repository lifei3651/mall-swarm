# 本机真实流程测试：使用本机 MySQL/Redis，不依赖 Nacos 或其他远程服务。
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mall_distribution?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
  boot:
    admin:
      client:
        enabled: false

# 本机测试能力必须通过显式 local profile 才能开启，基础配置始终保持安全。
shop:
  payment:
    simulation-enabled: true

sms:
  expose-code: true
  test-code: 123456
