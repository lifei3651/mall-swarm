server:
  # 生产后端只允许本机 Nginx 访问；如在容器网络运行，必须显式设置 SERVER_ADDRESS=0.0.0.0。
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8086
  compression:
    enabled: ${SERVER_COMPRESSION_ENABLED:true}
    min-response-size: ${SERVER_COMPRESSION_MIN_SIZE:1KB}
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript,image/svg+xml
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: mall-distribution
  datasource:
    # 生产数据库连接默认要求加密；远程数据库建议进一步设为 VERIFY_IDENTITY 并配置可信 CA。
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:mall}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&sslMode=${DB_SSL_MODE:REQUIRED}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    druid:
      initial-size: ${DB_POOL_INITIAL_SIZE:5}
      min-idle: ${DB_POOL_MIN_IDLE:5}
      max-active: ${DB_POOL_MAX_ACTIVE:20}
      max-wait: ${DB_POOL_MAX_WAIT_MS:3000}
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      # 私有模板走 Docker 内部网络可保持 false；外部托管 Redis 应设置为 true 并配置可信证书。
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:3s}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:32}
          max-idle: ${REDIS_POOL_MAX_IDLE:16}
          min-idle: ${REDIS_POOL_MIN_IDLE:4}
          max-wait: ${REDIS_POOL_MAX_WAIT:2s}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:nacos-registry:8848}
      config:
        server-addr: ${NACOS_SERVER:nacos-registry:8848}
        file-extension: yaml
  config:
    import:
      - optional:nacos:mall-distribution-prod.yaml?refreshEnabled=true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.macro.mall.distribution.entity
  configuration:
    map-underscore-to-camel-case: true
    local-cache-scope: statement
    cache-enabled: false

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

logging:
  level:
    root: WARN
    com.macro.mall.distribution: INFO

admin:
  security:
    # 默认12小时；如确需调整，只通过服务器环境变量覆盖，不写入前端。
    session-hours: ${ADMIN_SESSION_HOURS:12}

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: ${SA_TOKEN_TIMEOUT:86400}
  active-timeout: ${SA_TOKEN_ACTIVE_TIMEOUT:1800}
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-read-cookie: false
  cookie:
    secure: true
    http-only: true
    same-site: Strict

# 生产环境禁止暴露接口文档和调试入口。
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

shop:
  realtime:
    heartbeat-ms: ${SHOP_REALTIME_HEARTBEAT_MS:25000}
  logistics:
    tracking-provider: ${SHOP_LOGISTICS_TRACKING_PROVIDER:NONE}
  catalog-cache:
    enabled: ${SHOP_CATALOG_CACHE_ENABLED:true}
    home-ttl-seconds: ${SHOP_CATALOG_HOME_TTL_SECONDS:30}
    product-ttl-seconds: ${SHOP_CATALOG_PRODUCT_TTL_SECONDS:15}
    category-ttl-seconds: ${SHOP_CATALOG_CATEGORY_TTL_SECONDS:60}
  media:
    storage-dir: ${SHOP_MEDIA_STORAGE_DIR:/opt/lingqimall/uploads/products}
    private-storage-dir: ${SHOP_MEDIA_PRIVATE_STORAGE_DIR:/opt/lingqimall/uploads/private}
    max-dimension: ${SHOP_MEDIA_MAX_DIMENSION:1920}
    max-pixels: ${SHOP_MEDIA_MAX_PIXELS:25000000}
    jpeg-quality: ${SHOP_MEDIA_JPEG_QUALITY:0.82}
  payment:
    simulation-enabled: false
  withdrawal:
    daily-max-count: ${SHOP_WITHDRAWAL_DAILY_MAX_COUNT:5}
    monthly-max-count: ${SHOP_WITHDRAWAL_MONTHLY_MAX_COUNT:50}
    daily-max-amount: ${SHOP_WITHDRAWAL_DAILY_MAX_AMOUNT:100000.00}
    monthly-max-amount: ${SHOP_WITHDRAWAL_MONTHLY_MAX_AMOUNT:1000000.00}
  order:
    pending-timeout-minutes: ${ORDER_PENDING_TIMEOUT_MINUTES:30}
    pending-scan-interval-ms: ${ORDER_PENDING_SCAN_INTERVAL_MS:60000}
  after-sale:
    return-shipment-timeout-days: ${AFTER_SALE_RETURN_SHIPMENT_TIMEOUT_DAYS:7}
    return-shipment-scan-interval-ms: ${AFTER_SALE_RETURN_SHIPMENT_SCAN_INTERVAL_MS:600000}
payment:
  verification:
    enabled: ${PAYMENT_LARGE_AMOUNT_VERIFY_ENABLED:false}
    threshold: ${PAYMENT_LARGE_AMOUNT_VERIFY_THRESHOLD:500}
sms:
  provider-enabled: ${SMS_PROVIDER_ENABLED:false}
  expose-code: false
  test-code: ""
  aliyun:
    access-key-id: ${SMS_ALIYUN_ACCESS_KEY_ID:}
    access-key-secret: ${SMS_ALIYUN_ACCESS_KEY_SECRET:}
    endpoint: ${SMS_ALIYUN_ENDPOINT:dysmsapi.aliyuncs.com}
    connect-timeout-ms: ${SMS_ALIYUN_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${SMS_ALIYUN_READ_TIMEOUT_MS:10000}
    sign-name: ${SMS_ALIYUN_SIGN_NAME:}
    templates:
      register: ${SMS_TEMPLATE_REGISTER:}
      login: ${SMS_TEMPLATE_LOGIN:}
      reset-password: ${SMS_TEMPLATE_RESET_PASSWORD:}
      transfer: ${SMS_TEMPLATE_TRANSFER:}
      withdraw: ${SMS_TEMPLATE_WITHDRAW:}
      payment: ${SMS_TEMPLATE_PAYMENT:}
      payment-password: ${SMS_TEMPLATE_PAYMENT_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        # 默认仅供容器健康检查；如客户部署内网 Prometheus，再显式配置 metrics,prometheus。
        include: ${MANAGEMENT_ENDPOINTS:health}
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

database:
  monitor:
    slow-query-ms: ${DB_SLOW_QUERY_MS:1000}
    row-warning-threshold: ${DB_ROW_WARNING_THRESHOLD:1000000}
    size-warning-mb: ${DB_SIZE_WARNING_MB:2048}
    pool-warning-percent: ${DB_POOL_WARNING_PERCENT:80}
    pool-sample-ms: ${DB_POOL_SAMPLE_MS:15000}
    pool-initial-delay-ms: ${DB_POOL_INITIAL_DELAY_MS:60000}
    capacity-cron: "${DB_CAPACITY_MONITOR_CRON:0 15 3 * * ?}"

cache:
  monitor:
    sample-ms: ${CACHE_MONITOR_SAMPLE_MS:15000}
    initial-delay-ms: ${CACHE_MONITOR_INITIAL_DELAY_MS:60000}

bonus:
  # 正式口径：从订单确认收货开始计算7天保护期；每10分钟扫描一次到期奖金。
  settlement:
    cooling-off-days: ${BONUS_SETTLEMENT_COOLING_OFF_DAYS:7}
    scan-interval-ms: ${BONUS_SETTLEMENT_SCAN_INTERVAL_MS:600000}

order:
  # 可通过环境变量调整，但生产启用前必须确认两个目标会员均已进入会员关系体系。
  balance-allocation:
    remainder-account: ${ORDER_REMAINDER_ACCOUNT:SYSTEM_REMAINDER}
    product-cost-account: ${ORDER_PRODUCT_COST_ACCOUNT:SYSTEM_PRODUCT_COST}
