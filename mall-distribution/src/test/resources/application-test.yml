spring:
  # 禁用 Nacos
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
  # 禁用 Spring Boot Admin
  boot:
    admin:
      client:
        enabled: false
  # 排除自动配置
  autoconfigure:
    exclude:
      - com.alibaba.cloud.nacos.NacosDiscoveryAutoConfiguration
      - com.alibaba.cloud.nacos.NacosConfigAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - cn.dev33.satoken.dao.SaTokenDaoForRedisTemplate
      - de.codecentric.boot.admin.client.autoconfigure.SpringBootAdminClientAutoConfiguration
  # H2 数据库
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  # SQL初始化
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
      data-locations: classpath:db/data-h2.sql
  h2:
    console:
      enabled: true

# 禁用 Sa-Token
sa-token:
  disable: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.macro.mall.distribution.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.macro.mall.distribution: debug
    org.springframework: warn

shop:
  catalog-cache:
    enabled: false
  payment:
    simulation-enabled: true

sms:
  expose-code: true
  test-code: 123456

security:
  data-encryption-key: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
  data-encryption:
    write-enabled: true
