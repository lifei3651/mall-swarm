server_tokens off;
limit_req_status 429;

# 访问日志仅记录路径，不记录查询参数、Referer 或转发链，避免验证码、订单号等业务参数进入日志。
log_format lingqimall_safe '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                            '"$http_user_agent" request_id="$request_id"';

# API 通用限速：每 IP 20 请求/秒，桶深 10m（约 16 万个 IP）
limit_req_zone $binary_remote_addr zone=lingqimall_api:10m rate=20r/s;

# 敏感接口（登录/注册/验证码/重置密码）单独限速：3 请求/秒
limit_req_zone $binary_remote_addr zone=lingqimall_sensitive:10m rate=3r/s;

# 按 IP 限制并发连接数，防 CC
limit_conn_zone $binary_remote_addr zone=lingqimall_conn:10m;
