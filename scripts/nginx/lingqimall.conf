# =============================================================
# 灵启商城 — 生产环境 Nginx 配置（加固版）
# 域名：lingqimall.com
# 部署路径：/opt/lingqimall/
# =============================================================

# ---------- 上游：后端服务 ----------
upstream mall_distribution {
    server 127.0.0.1:8086;
    keepalive 32;            # 长连接复用，减少 TCP 握手
}

# 未知域名或直接 IP 的 HTTPS 请求不进入商城站点。
server {
    listen 443 ssl http2 default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/lingqimall.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lingqimall.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    return 404;
}

# ---------- 主站 HTTPS ----------
server {
    server_name lingqimall.com www.lingqimall.com;

    root /opt/lingqimall/nginx/shop;
    index index.html;
    client_max_body_size 6m;

    access_log /opt/lingqimall/logs/nginx/access.log lingqimall_safe;
    error_log  /opt/lingqimall/logs/nginx/error.log;

    # ---- SSL ----
    # Ubuntu 22.04 自带 Nginx 1.18 使用 listen 参数启用 HTTP/2。
    listen 443 ssl http2;
    ssl_certificate     /etc/letsencrypt/live/lingqimall.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lingqimall.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # TLS 版本、密码套件、会话缓存和 Session Ticket 由 Certbot 的
    # options-ssl-nginx.conf 统一维护，避免重复指令并跟随安全更新。

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 223.5.5.5 8.8.8.8 valid=300s;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "SAMEORIGIN" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # CSP：限制资源来源，防 XSS 注入
    # 支付宝手机网站支付通过 POST 表单跳转到官方网关；仅放行官方网关，保持其它外站表单提交禁止。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://openapi.alipay.com; frame-ancestors 'self'; upgrade-insecure-requests;" always;

    # ---- 并发连接限制 ----
    limit_conn lingqimall_conn 50;

    # ---- Gzip 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ---- 管理后台（SPA）----
    location = /admin { return 301 /admin/; }

    # Vite构建产物文件名自带内容哈希，可以安全长期缓存。
    location ^~ /admin/assets/ {
        alias /opt/lingqimall/nginx/admin/assets/;
        expires 365d;
        access_log off;
    }

    location = /admin/index.html {
        alias /opt/lingqimall/nginx/admin/index.html;
        expires -1;
    }

    location ^~ /admin/ {
        alias /opt/lingqimall/nginx/admin/;
        # SPA入口不能长期缓存，否则发布后已打开的后台可能继续加载旧分块文件。
        # /admin/assets/ 由上面的精确前缀规则继续使用带哈希的长期缓存。
        expires -1;
        try_files $uri $uri/ /admin/index.html;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 365d;
        access_log off;
    }

    location = /index.html {
        try_files $uri =404;
        expires -1;
    }

    # 本地图片直接由Nginx读取，避免每次占用Java后端线程。
    # 内容摘要文件名不会被覆盖，因此可长期缓存。
    location ~ "^/api/shop/media/images/([a-fA-F0-9]{32}\.(?:jpg|jpeg|png|webp|gif))$" {
        alias /opt/lingqimall/uploads/products/$1;
        expires 365d;
        access_log off;
    }

    # 订单/售后实时事件流：关闭代理缓冲，长连接断开后由浏览器自动重连。
    location ~ ^/api/shop/(admin/)?events/orders$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://mall_distribution;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_set_header Accept            $http_accept;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Cache-Control     "no-cache";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_send_timeout 35m;
        proxy_read_timeout 35m;
        gzip off;
        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- 敏感接口：独立限速 ----
    location ~ ^/api/(captcha|sms/send|shop/auth/|shop/wallet(?:/|$)) {
        limit_req zone=lingqimall_sensitive burst=8 nodelay;
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://mall_distribution;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 安全：禁止缓存敏感响应
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # 健康检查只允许服务器本机直连后端，不从公网反向代理暴露。
    location = /api/actuator {
        return 404;
    }

    location ^~ /api/actuator/ {
        return 404;
    }

    location ^~ /api/v1/actuator/ {
        return 404;
    }

    # 生产环境禁止暴露接口文档、Swagger UI 和调试端点。
    location ~ ^/(api/(v1/)?)?(v3/api-docs|swagger-ui|swagger-ui\.html)(/|$) {
        return 404;
    }

    # ---- 分销管理 API ----
    location /api/distribution/ {
        limit_req zone=lingqimall_api burst=60 nodelay;
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://mall_distribution;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ---- v1 API：新客户端优先使用；旧 /api/ 地址继续兼容 ----
    # 敏感接口保持与旧地址一致的独立限速，避免通过版本前缀绕过保护。
    location ~ ^/api/v1/(captcha|sms/send|shop/auth/|shop/wallet(?:/|$)) {
        limit_req zone=lingqimall_sensitive burst=8 nodelay;
        rewrite ^/api/v1/(.*)$ /$1 break;

        proxy_pass http://mall_distribution;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /api/v1/ {
        limit_req zone=lingqimall_api burst=60 nodelay;
        rewrite ^/api/v1/(.*)$ /$1 break;

        proxy_pass http://mall_distribution;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ---- 通用 API 代理 ----
    location /api/ {
        limit_req zone=lingqimall_api burst=60 nodelay;
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://mall_distribution;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # ---- SPA 路由回退 ----
    location / { try_files $uri $uri/ /index.html; }

    # ---- 屏蔽敏感路径 ----
    location ~ /\.(git|env|svn) {
        deny all;
        return 404;
    }

    # ---- 屏蔽常见扫描路径 ----
    location ~ ^/(wp-admin|wp-login|phpmyadmin|admin\.php|\.well-known/security\.txt) {
        return 404;
    }
}

# ---- HTTP → HTTPS 强制跳转（域名访问）----
server {
    listen 80;
    server_name lingqimall.com www.lingqimall.com;
    return 301 https://$host$request_uri;
}

# ---- 直接 IP 访问 → 404 ----
server {
    listen 80 default_server;
    server_name 115.159.199.171 _;
    return 404;
}
