<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">灵启商城 1.0.82 产品全景与下一步路线</title>
  <desc id="desc">展示 1.0.82 已上线能力，以及现在做什么、等待客户什么、暂缓什么。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#fffaf5"/>
    </linearGradient>
    <linearGradient id="root" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#155eef"/>
      <stop offset="1" stop-color="#0040c1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#101828" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #101828; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #667085; }
      .root-title { font: 700 30px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #fff; }
      .root-subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #dbe8ff; }
      .branch-title { font: 700 21px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Apple Color Emoji", sans-serif; fill: #101828; }
      .item { font: 400 15px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #344054; }
      .small { font: 400 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #667085; }
      .strong { font: 600 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #b42318; }
      .line { fill: none; stroke-width: 5; stroke-linecap: round; opacity: .78; }
      .card { stroke-width: 2; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1600" height="1100" rx="28" fill="url(#bg)"/>
  <text x="60" y="56" class="title">灵启商城产品全景与下一步路线</text>
  <text x="60" y="88" class="subtitle">线上 / 本地 1.0.82 已发布 ｜ 统一个人消息中心已上线 ｜ 2026-08-24</text>

  <path class="line" stroke="#2e90fa" d="M620 445 C570 410, 560 315, 530 290"/>
  <path class="line" stroke="#12b76a" d="M620 555 C565 610, 555 760, 530 805"/>
  <path class="line" stroke="#f79009" d="M980 430 C1020 370, 1025 270, 1060 235"/>
  <path class="line" stroke="#eaaa08" d="M980 500 C1020 520, 1030 590, 1060 615"/>
  <path class="line" stroke="#667085" d="M980 565 C1020 665, 1030 840, 1060 870"/>
  <path class="line" stroke="#7a5af8" d="M800 610 C800 670, 800 725, 800 755"/>

  <rect x="620" y="390" width="360" height="220" rx="28" fill="url(#root)" filter="url(#shadow)"/>
  <text x="800" y="462" text-anchor="middle" class="root-title">灵启商城 1.0.82</text>
  <text x="800" y="506" text-anchor="middle" class="root-title">产品全景</text>
  <text x="800" y="548" text-anchor="middle" class="root-subtitle">商城 · 团队 · 后台 · 商户</text>
  <text x="800" y="577" text-anchor="middle" class="root-subtitle">个人消息中心已上线</text>

  <rect class="card" x="55" y="130" width="505" height="310" rx="24" fill="#eff8ff" stroke="#84caff"/>
  <text x="85" y="172" class="branch-title">🟢 1.0.82 已上线开放</text>
  <text x="85" y="211" class="item">• 公开商城：商品、购物车、订单、售后、评价</text>
  <text x="85" y="244" class="item">• 团队 H5：邀请、业绩、奖金、钱包、提现</text>
  <text x="85" y="277" class="item">• 管理后台：商品、会员、财务、装修、审计</text>
  <text x="85" y="310" class="item">• 多商户：审核、子订单、货款、保证金、账本</text>
  <text x="85" y="343" class="item">• 个人消息：订单物流、售后退款、钱包资金</text>
  <text x="85" y="376" class="item">  账户安全、服务通知；跨端同步已读状态</text>
  <text x="85" y="414" class="small">三份线上版本清单已核对为 1.0.82</text>

  <rect class="card" x="55" y="650" width="505" height="335" rx="24" fill="#ecfdf3" stroke="#6ce9a6"/>
  <text x="85" y="692" class="branch-title">✅ 现在做什么</text>
  <text x="85" y="731" class="item">• 梳理主体、客服、备案、资质等客户资料</text>
  <text x="85" y="764" class="item">• 用真实图片、文案、商品、价格和库存替换测试内容</text>
  <text x="85" y="797" class="item">• 配置真实主播、直播间、商品和播放内容</text>
  <text x="85" y="830" class="item">• 配置新品商品与首次上架时间，形成真实新品内容</text>
  <text x="85" y="863" class="item">• 梳理短信 / App 推送 / 小程序通知所需外部条件</text>
  <text x="85" y="896" class="item">• 明确费用上限、隐私、回执、失败重试和验收标准</text>
  <text x="85" y="946" class="small">条件齐备并通过验收前，三类外部通知继续关闭</text>

  <rect class="card" x="1040" y="110" width="505" height="395" rx="24" fill="#fff4ed" stroke="#fdb022"/>
  <text x="1070" y="152" class="branch-title">🟠 等待客户什么</text>
  <text x="1070" y="191" class="item">• 经营主体、信用代码、地址、客服、备案与资质</text>
  <text x="1070" y="224" class="item">• 真实品牌图、文案、商品、价格、库存与公告</text>
  <text x="1070" y="257" class="item">• 短信：服务商账号、签名、审核模板、单价</text>
  <text x="1070" y="290" class="item">• App 推送：账号、证书 / 密钥、应用标识</text>
  <text x="1070" y="323" class="item">• 小程序通知：AppID / AppSecret、审核模板</text>
  <text x="1070" y="356" class="item">  以及用户逐次授权方案</text>
  <text x="1070" y="389" class="item">• 直播云资料（如启用）及奖金 / 复购规则确认</text>
  <text x="1070" y="429" class="strong">以上均为待提供、待联调、待验收，不代表已完成</text>
  <text x="1070" y="468" class="small">外部通知生产开关当前全部关闭，未发送真实消息</text>

  <rect class="card" x="1040" y="535" width="505" height="205" rx="24" fill="#fffaeb" stroke="#fec84b"/>
  <text x="1070" y="577" class="branch-title">🟡 已开发但未开放 / 待内容</text>
  <text x="1070" y="616" class="item">• 秒杀、复购：线上总开关关闭</text>
  <text x="1070" y="649" class="item">• Android：已经开发，尚未公开下载</text>
  <text x="1070" y="682" class="item">• 直播、新品：功能已上线，真实内容待配置</text>
  <text x="1070" y="715" class="item">• 外部消息通道：只有安全框架，生产全部关闭</text>

  <rect class="card" x="1040" y="770" width="505" height="230" rx="24" fill="#f2f4f7" stroke="#98a2b3"/>
  <text x="1070" y="812" class="branch-title">⏸ 暂缓什么</text>
  <text x="1070" y="851" class="item">• 外部支付接入与开放暂缓；现有余额支付不变</text>
  <text x="1070" y="884" class="item">• Android 公开发布暂缓（已开发但未开放）</text>
  <text x="1070" y="917" class="item">• 独立微信小程序暂缓立项，目前尚未开发</text>
  <text x="1070" y="950" class="item">• 微信支付、iOS、优惠券 / 收藏等增量模块暂缓</text>

  <rect class="card" x="600" y="755" width="400" height="230" rx="24" fill="#f4f3ff" stroke="#bdb4fe"/>
  <text x="800" y="800" text-anchor="middle" class="branch-title">路线总览</text>
  <text x="800" y="844" text-anchor="middle" class="item">现在：资料 + 真实内容 + 通知条件</text>
  <text x="800" y="880" text-anchor="middle" class="item">客户到齐：再做外部通道联调验收</text>
  <text x="800" y="916" text-anchor="middle" class="item">暂缓：支付 + Android 发布 + 独立小程序</text>
  <text x="800" y="956" text-anchor="middle" class="small">不把“有框架”当成“已开通”</text>

  <text x="60" y="1060" class="small">完整 XMind 含 4 个分页：产品全景、消费者购物流程、团队与商户流程、实施路线图</text>
  <text x="1540" y="1060" text-anchor="end" class="small">状态口径：2026-08-24</text>
</svg>
