# 订单/售后实时事件流需要禁用缓冲，否则浏览器不能及时收到状态变化。
location ~ ^/api/shop/(admin/)?events/orders$ {
    limit_req zone=mall_api burst=60 nodelay;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://mall_distribution;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_set_header Accept            $http_accept;
    proxy_set_header Authorization     $http_authorization;
    proxy_set_header Cache-Control     "no-cache";
    proxy_set_header X-Shop-Surface    $shop_surface;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_send_timeout 35m;
    proxy_read_timeout 35m;
    gzip off;
    add_header X-Accel-Buffering "no" always;
    add_header Cache-Control "no-store" always;
}

# 健康、监控、接口文档和调试入口不得通过公网代理。
location ~ ^/(api/(v1/)?)?(actuator|v3/api-docs|swagger-ui|swagger-ui\.html)(/|$) {
    return 404;
}

# 登录、注册、短信、钱包和关系确认入口使用更严格限流。
location ~ ^/api/(v1/)?(captcha|sms/send|shop/(?:auth/|public/auth/|wallet(?:/|$)|team/invitation$)) {
    limit_req zone=mall_sensitive burst=8 nodelay;
    rewrite ^/api/v1/(.*)$ /$1 break;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://mall_distribution;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_set_header X-Shop-Surface    $shop_surface;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

location /api/v1/ {
    limit_req zone=mall_api burst=60 nodelay;
    rewrite ^/api/v1/(.*)$ /$1 break;
    proxy_pass http://mall_distribution;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_set_header X-Shop-Surface    $shop_surface;
}

location /api/ {
    limit_req zone=mall_api burst=60 nodelay;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://mall_distribution;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_set_header X-Shop-Surface    $shop_surface;
}

location ~ /\.(git|env|svn) {
    deny all;
    return 404;
}
