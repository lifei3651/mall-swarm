# =============================================================
# 私有化部署 — Nginx 配置（加固版）
# 适用场景：Docker Compose / K8s 内部署
# =============================================================

# ---- 上游 ----
upstream mall_gateway {
    server mall-gateway:8201;
    keepalive 16;
}

upstream mall_distribution {
    server mall-distribution:8086;
    keepalive 16;
}

# ---- HTTPS 主站 ----
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # 证书路径（按实际部署调整，或通过 volume 挂载）
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # 安全响应头
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "SAMEORIGIN" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    root /usr/share/nginx/html;
    index index.html;

    # 通用 API → 网关
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://mall_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # 分销 API → distribution 服务
    location /distribution-api/ {
        rewrite ^/distribution-api/(.*)$ /$1 break;
        proxy_pass http://mall_distribution;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 屏蔽敏感路径
    location ~ /\.(git|env|svn) {
        deny all;
        return 404;
    }
}

# ---- HTTP → HTTPS 跳转 ----
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
