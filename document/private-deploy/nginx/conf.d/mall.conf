# =============================================================
# 私有化部署 — Nginx 配置（加固版）
# 适用场景：Docker Compose / K8s 内部署
# =============================================================

upstream mall_distribution {
    server mall-distribution:8086;
    keepalive 16;
}

# ---- HTTPS 主站 ----
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # 证书路径（按实际部署调整，或通过 volume 挂载）
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # 安全响应头
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "SAMEORIGIN" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    root /usr/share/nginx/html;
    index index.html;
    limit_conn mall_conn 40;

    # 管理后台静态文件固定放在 html/admin，刷新子路由时仍回到后台入口。
    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        try_files $uri $uri/ /admin/index.html;
        expires -1;
    }

    # 订单/售后实时事件流需要禁用缓冲，否则浏览器不能及时收到状态变化。
    location ~ ^/api/shop/(admin/)?events/orders$ {
        limit_req zone=mall_api burst=60 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://mall_distribution;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_set_header Accept            $http_accept;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Cache-Control     "no-cache";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_send_timeout 35m;
        proxy_read_timeout 35m;
        gzip off;
        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-store" always;
    }

    # 健康、监控、接口文档和调试入口不得通过公网代理。
    location ~ ^/(api/(v1/)?)?(actuator|v3/api-docs|swagger-ui|swagger-ui\.html)(/|$) {
        return 404;
    }

    # 登录、注册、短信、找回密码及钱包入口使用更严格限流。
    location ~ ^/api/(v1/)?(captcha|sms/send|shop/auth/|shop/wallet(?:/|$)) {
        limit_req zone=mall_sensitive burst=8 nodelay;
        rewrite ^/api/v1/(.*)$ /$1 break;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://mall_distribution;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # v1 API：移除版本前缀后交给现有网关；旧 /api/ 地址继续兼容。
    location /api/v1/ {
        limit_req zone=mall_api burst=60 nodelay;
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://mall_distribution;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # 通用 API → 网关
    location /api/ {
        limit_req zone=mall_api burst=60 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://mall_distribution;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 屏蔽敏感路径
    location ~ /\.(git|env|svn) {
        deny all;
        return 404;
    }
}

# ---- HTTP → HTTPS 跳转 ----
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
