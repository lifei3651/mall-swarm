services:
  mysql:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME}_mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ../sql:/init-sql/base:ro
      - ../../mall-distribution/document/sql:/init-sql/distribution:ro
      - ./initdb:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data

  nacos-registry:
    image: nacos/nacos-server:v2.3.0
    container_name: ${COMPOSE_PROJECT_NAME}_nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      TZ: ${TZ}
    ports:
      - "8848:8848"
      - "9848:9848"

  rabbitmq:
    image: rabbitmq:3.10-management
    container_name: ${COMPOSE_PROJECT_NAME}_rabbitmq
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq

  mongodb:
    image: mongo:5.0
    container_name: ${COMPOSE_PROJECT_NAME}_mongodb
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongodb:/data/db

  elasticsearch:
    image: elasticsearch:7.17.3
    container_name: ${COMPOSE_PROJECT_NAME}_elasticsearch
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data

  mall-auth:
    build:
      context: ../..
      dockerfile: mall-auth/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_mall_auth
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: ${TZ}
    depends_on:
      - nacos-registry
      - redis

  mall-gateway:
    build:
      context: ../..
      dockerfile: mall-gateway/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_mall_gateway
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: ${TZ}
    ports:
      - "8201:8201"
    depends_on:
      - nacos-registry
      - redis
      - mall-auth

  mall-admin:
    build:
      context: ../..
      dockerfile: mall-admin/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_mall_admin
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: ${TZ}
    depends_on:
      - mysql
      - redis
      - nacos-registry

  mall-portal:
    build:
      context: ../..
      dockerfile: mall-portal/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_mall_portal
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: ${TZ}
    depends_on:
      - mysql
      - redis
      - mongodb
      - rabbitmq
      - nacos-registry

  mall-search:
    build:
      context: ../..
      dockerfile: mall-search/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_mall_search
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: ${TZ}
    depends_on:
      - elasticsearch
      - nacos-registry

  mall-monitor:
    build:
      context: ../..
      dockerfile: mall-monitor/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_mall_monitor
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: ${TZ}
    ports:
      - "8101:8101"
    depends_on:
      - nacos-registry

  mall-distribution:
    build:
      context: ../..
      dockerfile: mall-distribution/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_mall_distribution
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: ${TZ}
      SERVER_ADDRESS: ${SERVER_ADDRESS:0.0.0.0}
    volumes:
      - ./data/uploads:/opt/lingqimall/uploads
    ports:
      - "8086:8086"
    depends_on:
      - mysql
      - redis
      - nacos-registry

  nginx:
    image: nginx:1.25-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./html:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - mall-gateway
      - mall-distribution
