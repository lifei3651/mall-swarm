x-runtime-common: &runtime-common
  SPRING_PROFILES_ACTIVE: prod
  TZ: ${TZ}
  NACOS_SERVER: ${NACOS_SERVER}

x-redis-client: &redis-client
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_DATABASE: ${REDIS_DATABASE}

x-database-client: &database-client
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_SSL_MODE: ${DB_SSL_MODE}

services:
  mysql:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME}_mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # 仅供宿主机备份脚本使用，不接受外网连接。
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ../sql:/init-sql/base:ro
      - ../../mall-distribution/document/sql:/init-sql/distribution:ro
      - ./initdb:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data

  nacos-registry:
    image: nacos/nacos-server:v2.3.0
    container_name: ${COMPOSE_PROJECT_NAME}_nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      TZ: ${TZ}

  rabbitmq:
    image: rabbitmq:3.10-management
    container_name: ${COMPOSE_PROJECT_NAME}_rabbitmq
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq

  mongodb:
    image: mongo:5.0
    container_name: ${COMPOSE_PROJECT_NAME}_mongodb
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    volumes:
      - ./data/mongodb:/data/db

  elasticsearch:
    image: elasticsearch:7.17.3
    container_name: ${COMPOSE_PROJECT_NAME}_elasticsearch
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data

  mall-auth:
    build:
      context: ../..
      dockerfile: mall-auth/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_mall_auth
    restart: unless-stopped
    environment:
      <<: [*runtime-common, *redis-client]
      SA_TOKEN_JWT_KEY: ${SA_TOKEN_JWT_KEY}
      SA_TOKEN_TIMEOUT: ${SA_TOKEN_TIMEOUT}
      SA_TOKEN_ACTIVE_TIMEOUT: ${SA_TOKEN_ACTIVE_TIMEOUT}
    depends_on:
      - nacos-registry
      - redis

  mall-gateway:
    build:
      context: ../..
      dockerfile: mall-gateway/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_mall_gateway
    restart: unless-stopped
    environment:
      <<: [*runtime-common, *redis-client]
      SA_TOKEN_JWT_KEY: ${SA_TOKEN_JWT_KEY}
      SA_TOKEN_TIMEOUT: ${SA_TOKEN_TIMEOUT}
      SA_TOKEN_ACTIVE_TIMEOUT: ${SA_TOKEN_ACTIVE_TIMEOUT}
    depends_on:
      - nacos-registry
      - redis
      - mall-auth

  mall-admin:
    build:
      context: ../..
      dockerfile: mall-admin/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_mall_admin
    restart: unless-stopped
    environment:
      <<: [*runtime-common, *redis-client, *database-client]
      SA_TOKEN_JWT_KEY: ${SA_TOKEN_JWT_KEY}
    depends_on:
      - mysql
      - redis
      - nacos-registry

  mall-portal:
    build:
      context: ../..
      dockerfile: mall-portal/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_mall_portal
    restart: unless-stopped
    environment:
      <<: [*runtime-common, *redis-client, *database-client]
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_DB: ${MONGO_DB}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      SA_TOKEN_JWT_KEY: ${SA_TOKEN_JWT_KEY}
    depends_on:
      - mysql
      - redis
      - mongodb
      - rabbitmq
      - nacos-registry

  mall-search:
    build:
      context: ../..
      dockerfile: mall-search/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_mall_search
    restart: unless-stopped
    environment:
      <<: *runtime-common
      ES_HOST: ${ES_HOST}
      ES_PORT: ${ES_PORT}
    depends_on:
      - elasticsearch
      - nacos-registry

  mall-monitor:
    build:
      context: ../..
      dockerfile: mall-monitor/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_mall_monitor
    restart: unless-stopped
    environment:
      <<: *runtime-common
      MONITOR_ADMIN_USER: ${MONITOR_ADMIN_USER}
      MONITOR_ADMIN_PASSWORD: ${MONITOR_ADMIN_PASSWORD}
    depends_on:
      - nacos-registry

  mall-distribution:
    build:
      context: ../..
      dockerfile: mall-distribution/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_mall_distribution
    restart: unless-stopped
    environment:
      <<: [*runtime-common, *redis-client, *database-client]
      SERVER_ADDRESS: ${SERVER_ADDRESS:0.0.0.0}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SA_TOKEN_JWT_KEY: ${SA_TOKEN_JWT_KEY}
      SA_TOKEN_TIMEOUT: ${SA_TOKEN_TIMEOUT}
      SA_TOKEN_ACTIVE_TIMEOUT: ${SA_TOKEN_ACTIVE_TIMEOUT}
      SHOP_MEDIA_STORAGE_DIR: ${SHOP_MEDIA_STORAGE_DIR}
      SHOP_MEDIA_PRIVATE_STORAGE_DIR: ${SHOP_MEDIA_PRIVATE_STORAGE_DIR}
      SHOP_MEDIA_MAX_DIMENSION: ${SHOP_MEDIA_MAX_DIMENSION}
      SHOP_MEDIA_MAX_PIXELS: ${SHOP_MEDIA_MAX_PIXELS}
      SHOP_MEDIA_JPEG_QUALITY: ${SHOP_MEDIA_JPEG_QUALITY}
      SHOP_LOGISTICS_TRACKING_PROVIDER: ${SHOP_LOGISTICS_TRACKING_PROVIDER}
      ORDER_PENDING_TIMEOUT_MINUTES: ${ORDER_PENDING_TIMEOUT_MINUTES}
      ORDER_PENDING_SCAN_INTERVAL_MS: ${ORDER_PENDING_SCAN_INTERVAL_MS}
      PAYMENT_LARGE_AMOUNT_VERIFY_ENABLED: ${PAYMENT_LARGE_AMOUNT_VERIFY_ENABLED}
      PAYMENT_LARGE_AMOUNT_VERIFY_THRESHOLD: ${PAYMENT_LARGE_AMOUNT_VERIFY_THRESHOLD}
      ALIPAY_ENABLED: ${ALIPAY_ENABLED}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL}
      ALIPAY_RETURN_URL: ${ALIPAY_RETURN_URL}
      SMS_PROVIDER_ENABLED: ${SMS_PROVIDER_ENABLED}
      SMS_ALIYUN_ACCESS_KEY_ID: ${SMS_ALIYUN_ACCESS_KEY_ID}
      SMS_ALIYUN_ACCESS_KEY_SECRET: ${SMS_ALIYUN_ACCESS_KEY_SECRET}
      SMS_ALIYUN_ENDPOINT: ${SMS_ALIYUN_ENDPOINT}
      SMS_ALIYUN_SIGN_NAME: ${SMS_ALIYUN_SIGN_NAME}
      SMS_TEMPLATE_REGISTER: ${SMS_TEMPLATE_REGISTER}
      SMS_TEMPLATE_LOGIN: ${SMS_TEMPLATE_LOGIN}
      SMS_TEMPLATE_RESET_PASSWORD: ${SMS_TEMPLATE_RESET_PASSWORD}
      SMS_TEMPLATE_TRANSFER: ${SMS_TEMPLATE_TRANSFER}
      SMS_TEMPLATE_WITHDRAW: ${SMS_TEMPLATE_WITHDRAW}
      SMS_TEMPLATE_PAYMENT: ${SMS_TEMPLATE_PAYMENT}
      SMS_TEMPLATE_PAYMENT_PASSWORD: ${SMS_TEMPLATE_PAYMENT_PASSWORD}
    volumes:
      - ./data/uploads:/opt/lingqimall/uploads
    depends_on:
      - mysql
      - redis
      - nacos-registry

  nginx:
    image: nginx:1.25-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./html:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - mall-gateway
      - mall-distribution
