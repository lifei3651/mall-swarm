x-runtime-common: &runtime-common
  SPRING_PROFILES_ACTIVE: prod
  TZ: ${TZ}
  SPRING_CLOUD_NACOS_DISCOVERY_ENABLED: "false"
  SPRING_CLOUD_NACOS_CONFIG_ENABLED: "false"

x-redis-client: &redis-client
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_DATABASE: ${REDIS_DATABASE}

x-database-client: &database-client
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_SSL_MODE: ${DB_SSL_MODE}

services:
  mysql:
    image: mysql:8.4.10
    container_name: ${COMPOSE_PROJECT_NAME}_mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../mall-distribution/document/sql/distribution.sql:/init-sql/distribution/distribution.sql:ro
      - ../../mall-distribution/document/sql/20260714_erp_integration_upgrade.sql:/init-sql/prerequisites/20260714_erp_integration_upgrade.sql:ro
      - ../sql/20260808_add_shop_service_addresses.sql:/init-sql/prerequisites/20260808_add_shop_service_addresses.sql:ro
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    cpus: ${MYSQL_CPU_LIMIT}
    mem_limit: ${MYSQL_MEMORY_LIMIT}
    pids_limit: ${MYSQL_PIDS_LIMIT}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/mysqld:rw,noexec,nosuid,size=32m
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.2.15-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --rename-command KEYS \"\" --rename-command FLUSHALL \"\" --rename-command FLUSHDB \"\" --rename-command CONFIG \"\" --rename-command SHUTDOWN \"\" --rename-command DEBUG \"\" --rename-command MODULE \"\""]
    volumes:
      - redis_data:/data
    networks:
      - data
    cpus: ${REDIS_CPU_LIMIT}
    mem_limit: ${REDIS_MEMORY_LIMIT}
    pids_limit: ${REDIS_PIDS_LIMIT}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20

  mall-distribution:
    build:
      context: ../..
      dockerfile: mall-distribution/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_mall_distribution
    restart: unless-stopped
    environment:
      <<: [*runtime-common, *redis-client, *database-client]
      SERVER_ADDRESS: 0.0.0.0
      CORS_ORIGINS: ${CORS_ORIGINS}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      DATA_ENCRYPTION_WRITE_ENABLED: ${DATA_ENCRYPTION_WRITE_ENABLED}
      SHOP_PAYMENT_SIMULATION_ENABLED: "false"
      ADMIN_SESSION_HOURS: ${ADMIN_SESSION_HOURS}
      ADMIN_MAX_ACTIVE_SESSIONS: ${ADMIN_MAX_ACTIVE_SESSIONS}
      SHOP_SESSION_DAYS: ${SHOP_SESSION_DAYS}
      SHOP_MAX_ACTIVE_SESSIONS: ${SHOP_MAX_ACTIVE_SESSIONS}
      SMS_EXPOSE_CODE: "false"
      SMS_TEST_CODE: ""
      SHOP_MEDIA_STORAGE_DIR: ${SHOP_MEDIA_STORAGE_DIR}
      SHOP_MEDIA_PRIVATE_STORAGE_DIR: ${SHOP_MEDIA_PRIVATE_STORAGE_DIR}
      SHOP_MEDIA_MAX_DIMENSION: ${SHOP_MEDIA_MAX_DIMENSION}
      SHOP_MEDIA_MAX_PIXELS: ${SHOP_MEDIA_MAX_PIXELS}
      SHOP_MEDIA_JPEG_QUALITY: ${SHOP_MEDIA_JPEG_QUALITY}
      SHOP_LOGISTICS_TRACKING_PROVIDER: ${SHOP_LOGISTICS_TRACKING_PROVIDER}
      SHOP_NEW_ARRIVAL_DAYS: ${SHOP_NEW_ARRIVAL_DAYS}
      SHOP_LIVE_PROVIDER: ${SHOP_LIVE_PROVIDER}
      LIVE_PLAYBACK_ORIGIN: ${LIVE_PLAYBACK_ORIGIN}
      TENCENT_LIVE_PUSH_DOMAIN: ${TENCENT_LIVE_PUSH_DOMAIN}
      TENCENT_LIVE_PLAY_DOMAIN: ${TENCENT_LIVE_PLAY_DOMAIN}
      TENCENT_LIVE_APP_NAME: ${TENCENT_LIVE_APP_NAME}
      TENCENT_LIVE_PUSH_AUTH_KEY: ${TENCENT_LIVE_PUSH_AUTH_KEY}
      TENCENT_LIVE_CALLBACK_AUTH_KEY: ${TENCENT_LIVE_CALLBACK_AUTH_KEY}
      TENCENT_LIVE_CREDENTIAL_SECONDS: ${TENCENT_LIVE_CREDENTIAL_SECONDS}
      ORDER_PENDING_TIMEOUT_MINUTES: ${ORDER_PENDING_TIMEOUT_MINUTES}
      ORDER_PENDING_SCAN_INTERVAL_MS: ${ORDER_PENDING_SCAN_INTERVAL_MS}
      SCHEDULING_POOL_SIZE: ${SCHEDULING_POOL_SIZE}
      ERP_SYNC_SCAN_INTERVAL_MS: ${ERP_SYNC_SCAN_INTERVAL_MS}
      BONUS_CALCULATION_SCAN_INTERVAL_MS: ${BONUS_CALCULATION_SCAN_INTERVAL_MS}
      PAYMENT_LARGE_AMOUNT_VERIFY_ENABLED: ${PAYMENT_LARGE_AMOUNT_VERIFY_ENABLED}
      PAYMENT_LARGE_AMOUNT_VERIFY_THRESHOLD: ${PAYMENT_LARGE_AMOUNT_VERIFY_THRESHOLD}
      SHOP_WITHDRAWAL_DAILY_MAX_COUNT: ${SHOP_WITHDRAWAL_DAILY_MAX_COUNT}
      SHOP_WITHDRAWAL_MONTHLY_MAX_COUNT: ${SHOP_WITHDRAWAL_MONTHLY_MAX_COUNT}
      SHOP_WITHDRAWAL_DAILY_MAX_AMOUNT: ${SHOP_WITHDRAWAL_DAILY_MAX_AMOUNT}
      SHOP_WITHDRAWAL_MONTHLY_MAX_AMOUNT: ${SHOP_WITHDRAWAL_MONTHLY_MAX_AMOUNT}
      WECHAT_MINI_PROGRAM_ENABLED: ${WECHAT_MINI_PROGRAM_ENABLED}
      WECHAT_MINI_PROGRAM_PHONE_AUTH_ENABLED: ${WECHAT_MINI_PROGRAM_PHONE_AUTH_ENABLED}
      WECHAT_MINI_PROGRAM_APP_ID: ${WECHAT_MINI_PROGRAM_APP_ID}
      WECHAT_MINI_PROGRAM_APP_SECRET: ${WECHAT_MINI_PROGRAM_APP_SECRET}
      WECHAT_MINI_PROGRAM_PRIVACY_VERSION: ${WECHAT_MINI_PROGRAM_PRIVACY_VERSION}
      WECHAT_MINI_PROGRAM_CONNECT_TIMEOUT_MS: ${WECHAT_MINI_PROGRAM_CONNECT_TIMEOUT_MS}
      WECHAT_MINI_PROGRAM_READ_TIMEOUT_MS: ${WECHAT_MINI_PROGRAM_READ_TIMEOUT_MS}
      WECHAT_PAY_ENABLED: ${WECHAT_PAY_ENABLED}
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID}
      WECHAT_PAY_MERCHANT_SERIAL_NUMBER: ${WECHAT_PAY_MERCHANT_SERIAL_NUMBER}
      WECHAT_PAY_PRIVATE_KEY_PATH: ${WECHAT_PAY_PRIVATE_KEY_PATH}
      WECHAT_PAY_PUBLIC_KEY_ID: ${WECHAT_PAY_PUBLIC_KEY_ID}
      WECHAT_PAY_PUBLIC_KEY_PATH: ${WECHAT_PAY_PUBLIC_KEY_PATH}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL}
      WECHAT_PAY_REFUND_NOTIFY_URL: ${WECHAT_PAY_REFUND_NOTIFY_URL}
      WECHAT_PAY_CONNECT_TIMEOUT_MS: ${WECHAT_PAY_CONNECT_TIMEOUT_MS}
      WECHAT_PAY_READ_TIMEOUT_MS: ${WECHAT_PAY_READ_TIMEOUT_MS}
      ALIPAY_ENABLED: ${ALIPAY_ENABLED}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID}
      ALIPAY_SELLER_ID: ${ALIPAY_SELLER_ID}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL}
      ALIPAY_RETURN_URL: ${ALIPAY_RETURN_URL}
      ALIPAY_CONNECT_TIMEOUT_MS: ${ALIPAY_CONNECT_TIMEOUT_MS}
      ALIPAY_READ_TIMEOUT_MS: ${ALIPAY_READ_TIMEOUT_MS}
      SMS_PROVIDER_ENABLED: ${SMS_PROVIDER_ENABLED}
      SHOP_REAL_NAME_ENABLED: ${SHOP_REAL_NAME_ENABLED}
      TENCENT_FACEID_SECRET_ID: ${TENCENT_FACEID_SECRET_ID}
      TENCENT_FACEID_SECRET_KEY: ${TENCENT_FACEID_SECRET_KEY}
      TENCENT_FACEID_REGION: ${TENCENT_FACEID_REGION}
      TENCENT_FACEID_ENDPOINT: ${TENCENT_FACEID_ENDPOINT}
      SHOP_REAL_NAME_DAILY_MAX_ATTEMPTS: ${SHOP_REAL_NAME_DAILY_MAX_ATTEMPTS}
      TENCENT_FACEID_CONNECT_TIMEOUT_SECONDS: ${TENCENT_FACEID_CONNECT_TIMEOUT_SECONDS}
      TENCENT_FACEID_READ_TIMEOUT_SECONDS: ${TENCENT_FACEID_READ_TIMEOUT_SECONDS}
      SMS_ALIYUN_ACCESS_KEY_ID: ${SMS_ALIYUN_ACCESS_KEY_ID}
      SMS_ALIYUN_ACCESS_KEY_SECRET: ${SMS_ALIYUN_ACCESS_KEY_SECRET}
      SMS_ALIYUN_ENDPOINT: ${SMS_ALIYUN_ENDPOINT}
      SMS_ALIYUN_CONNECT_TIMEOUT_MS: ${SMS_ALIYUN_CONNECT_TIMEOUT_MS}
      SMS_ALIYUN_READ_TIMEOUT_MS: ${SMS_ALIYUN_READ_TIMEOUT_MS}
      SMS_ALIYUN_SIGN_NAME: ${SMS_ALIYUN_SIGN_NAME}
      SMS_TEMPLATE_REGISTER: ${SMS_TEMPLATE_REGISTER}
      SMS_TEMPLATE_LOGIN: ${SMS_TEMPLATE_LOGIN}
      SMS_TEMPLATE_RESET_PASSWORD: ${SMS_TEMPLATE_RESET_PASSWORD}
      SMS_TEMPLATE_TRANSFER: ${SMS_TEMPLATE_TRANSFER}
      SMS_TEMPLATE_WITHDRAW: ${SMS_TEMPLATE_WITHDRAW}
      SMS_TEMPLATE_PAYMENT: ${SMS_TEMPLATE_PAYMENT}
      SMS_TEMPLATE_PAYMENT_PASSWORD: ${SMS_TEMPLATE_PAYMENT_PASSWORD}
      EXTERNAL_NOTIFICATION_ENABLED: ${EXTERNAL_NOTIFICATION_ENABLED}
      EXTERNAL_NOTIFICATION_WORKER_ENABLED: ${EXTERNAL_NOTIFICATION_WORKER_ENABLED}
      EXTERNAL_NOTIFICATION_BATCH_SIZE: ${EXTERNAL_NOTIFICATION_BATCH_SIZE}
      EXTERNAL_NOTIFICATION_LEASE_SECONDS: ${EXTERNAL_NOTIFICATION_LEASE_SECONDS}
      EXTERNAL_NOTIFICATION_TASK_TTL_HOURS: ${EXTERNAL_NOTIFICATION_TASK_TTL_HOURS}
      EXTERNAL_NOTIFICATION_MAX_ATTEMPTS: ${EXTERNAL_NOTIFICATION_MAX_ATTEMPTS}
      EXTERNAL_NOTIFICATION_BASE_RETRY_SECONDS: ${EXTERNAL_NOTIFICATION_BASE_RETRY_SECONDS}
      EXTERNAL_NOTIFICATION_MAX_RETRY_SECONDS: ${EXTERNAL_NOTIFICATION_MAX_RETRY_SECONDS}
      EXTERNAL_NOTIFICATION_UNKNOWN_QUERY_LIMIT: ${EXTERNAL_NOTIFICATION_UNKNOWN_QUERY_LIMIT}
      NOTIFICATION_SMS_ALIYUN_ENABLED: ${NOTIFICATION_SMS_ALIYUN_ENABLED}
      NOTIFICATION_SMS_ALIYUN_ACCESS_KEY_ID: ${NOTIFICATION_SMS_ALIYUN_ACCESS_KEY_ID}
      NOTIFICATION_SMS_ALIYUN_ACCESS_KEY_SECRET: ${NOTIFICATION_SMS_ALIYUN_ACCESS_KEY_SECRET}
      NOTIFICATION_SMS_ALIYUN_ENDPOINT: ${NOTIFICATION_SMS_ALIYUN_ENDPOINT}
      NOTIFICATION_SMS_ALIYUN_SIGN_NAME: ${NOTIFICATION_SMS_ALIYUN_SIGN_NAME}
      NOTIFICATION_SMS_ALIYUN_RECEIPT_SECRET: ${NOTIFICATION_SMS_ALIYUN_RECEIPT_SECRET}
      NOTIFICATION_SMS_ALIYUN_CONNECT_TIMEOUT_MS: ${NOTIFICATION_SMS_ALIYUN_CONNECT_TIMEOUT_MS}
      NOTIFICATION_SMS_ALIYUN_READ_TIMEOUT_MS: ${NOTIFICATION_SMS_ALIYUN_READ_TIMEOUT_MS}
      NOTIFICATION_SMS_UNIT_COST: ${NOTIFICATION_SMS_UNIT_COST}
      NOTIFICATION_SMS_TEMPLATE_LOGIN_PASSWORD_CHANGED: ${NOTIFICATION_SMS_TEMPLATE_LOGIN_PASSWORD_CHANGED}
      NOTIFICATION_SMS_TEMPLATE_PAY_PASSWORD_CHANGED: ${NOTIFICATION_SMS_TEMPLATE_PAY_PASSWORD_CHANGED}
      NOTIFICATION_SMS_TEMPLATE_PHONE_CHANGED: ${NOTIFICATION_SMS_TEMPLATE_PHONE_CHANGED}
      NOTIFICATION_SMS_TEMPLATE_ORDER_SHIPPED: ${NOTIFICATION_SMS_TEMPLATE_ORDER_SHIPPED}
      NOTIFICATION_SMS_TEMPLATE_AFTER_SALE_UPDATED: ${NOTIFICATION_SMS_TEMPLATE_AFTER_SALE_UPDATED}
      NOTIFICATION_SMS_TEMPLATE_REFUND_RESULT: ${NOTIFICATION_SMS_TEMPLATE_REFUND_RESULT}
      NOTIFICATION_MOCK_ENABLED: "false"
      NOTIFICATION_MOCK_APP_PUSH_ENABLED: "false"
      NOTIFICATION_MOCK_MINI_PROGRAM_ENABLED: "false"
    volumes:
      - uploads_data:/opt/lingqimall/uploads
      - ${WECHAT_PAY_CERT_DIR}:/run/secrets/wechat-pay:ro
    networks:
      - edge
      - data
    cpus: ${APP_CPU_LIMIT}
    mem_limit: ${APP_MEMORY_LIMIT}
    pids_limit: ${APP_PIDS_LIMIT}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8086/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m

  nginx:
    image: nginx:1.28.3-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_nginx
    restart: unless-stopped
    environment:
      CUSTOMER_DOMAIN: ${CUSTOMER_DOMAIN}
      TEAM_DOMAIN: ${TEAM_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      LIVE_PLAYBACK_ORIGIN: ${LIVE_PLAYBACK_ORIGIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/templates:ro
      - ./nginx/includes:/etc/nginx/includes:ro
      - ./html:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - edge
    cpus: ${NGINX_CPU_LIMIT}
    mem_limit: ${NGINX_MEMORY_LIMIT}
    pids_limit: ${NGINX_PIDS_LIMIT}
    depends_on:
      mall-distribution:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=4m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=4m

networks:
  edge:
    name: ${COMPOSE_PROJECT_NAME}_edge
  data:
    name: ${COMPOSE_PROJECT_NAME}_data
    internal: true

volumes:
  mysql_data:
    name: ${COMPOSE_PROJECT_NAME}_mysql_data
  redis_data:
    name: ${COMPOSE_PROJECT_NAME}_redis_data
  uploads_data:
    name: ${COMPOSE_PROJECT_NAME}_uploads_data
