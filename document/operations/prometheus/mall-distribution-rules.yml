groups:
  - name: mall-distribution-database-cache
    rules:
      - alert: MallDatabaseSlowQueries
        expr: increase(mall_database_query_slow_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "商城数据库出现慢查询"
          description: "最近 5 分钟存在超过系统阈值的 Mapper 调用，请检查 statement 标签和执行计划。"

      - alert: MallDatabaseQueryP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(mall_database_query_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "商城数据库查询 P95 超过 1 秒"
          description: "数据库查询整体变慢，请检查慢查询、数据库负载和组合索引使用情况。"

      - alert: MallDatabasePoolUsageHigh
        expr: mall_database_pool_max > 0 and mall_database_pool_active / mall_database_pool_max >= 0.8
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "商城数据库连接池使用率超过 80%"
          description: "连接池持续高水位，需检查慢查询、长事务和数据库连接上限。"

      - alert: MallDatabasePoolWaiters
        expr: mall_database_pool_waiting > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "商城请求正在等待数据库连接"
          description: "连接池已经出现等待线程，交易接口可能发生延迟或超时。"

      - alert: MallRedisUnavailable
        expr: mall_cache_redis_available == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "商城 Redis 缓存不可用"
          description: "商城公共数据会自动回源数据库，但数据库压力会升高，请立即检查 Redis。"

      - alert: MallRedisLatencyHigh
        expr: mall_cache_redis_ping >= 100
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "商城 Redis 延迟超过 100 毫秒"
          description: "请检查 Redis 负载、网络和慢命令。"

      - alert: MallCatalogCacheHitRateLow
        expr: |
          (
            sum(rate(mall_cache_requests_total{cache="shop_catalog",result="hit"}[10m]))
            /
            clamp_min(sum(rate(mall_cache_requests_total{cache="shop_catalog",result=~"hit|miss"}[10m])), 0.001)
            < 0.6
          )
          and
          sum(increase(mall_cache_requests_total{cache="shop_catalog",result=~"hit|miss"}[10m])) >= 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "商城商品缓存命中率低于 60%"
          description: "请检查缓存 TTL、频繁失效、Redis 容量及商品读取模式。"

  - name: mall-distribution-business-operations
    rules:
      - alert: MallBusinessMetricsMissing
        expr: absent(mall_business_monitor_available)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "商城业务聚合指标缺失"
          description: "Prometheus 连续未采集到商城业务聚合指标，请检查 Actuator 暴露范围、采集目标和应用版本。"

      - alert: MallBusinessMonitorUnavailable
        expr: mall_business_monitor_available != 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "商城业务聚合监控采样失败"
          description: "业务监控源 {{ $labels.type }}/{{ $labels.source }} 连续不可用；指标值已置为 -1，不能将其解释为零积压。"

      - alert: MallBusinessTaskTerminalFailures
        expr: mall_business_task_failures > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "商城异步任务存在终态失败"
          description: "任务 {{ $labels.task }} 有 {{ $value }} 条终态失败，请按运行手册只读核对后再使用既有恢复入口。"

      - alert: MallWechatTaskBacklogOld
        expr: mall_business_task_oldest_age_seconds{task=~"wechat_shipping_sync|wechat_logistics_follow"} > 900
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "微信发货或物流任务积压超过 15 分钟"
          description: "任务 {{ $labels.task }} 最老积压年龄为 {{ $value }} 秒。"

      - alert: MallBonusTaskBacklogOld
        expr: mall_business_task_oldest_age_seconds{task="bonus_calculation"} > 600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "奖金计算任务积压超过 10 分钟"
          description: "奖金计算最老积压年龄为 {{ $value }} 秒，请检查奖金任务调度与失败终态。"

      - alert: MallErpTaskBacklogOld
        expr: mall_business_task_oldest_age_seconds{task="erp_sync"} > 1800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ERP 同步任务积压超过 30 分钟"
          description: "ERP 同步最老积压年龄为 {{ $value }} 秒，请检查已启用集成的授权和重试状态。"

      - alert: MallRefundProcessingTimedOut
        expr: mall_business_operation_timed_out{operation="refund"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "外部渠道退款处理超时"
          description: "有 {{ $value }} 笔微信/支付宝退款超过处理阈值；只读核对渠道结果后使用既有退款恢复流程。"

      - alert: MallWithdrawalPayoutTimedOut
        expr: mall_business_operation_timed_out{operation="withdrawal_payout"} > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "提现打款处理超时"
          description: "有 {{ $value }} 笔提现打款超过处理阈值；先核对渠道结果，禁止直接重复打款。"

      - alert: MallMerchantLedgerMismatch
        expr: mall_business_ledger_mismatches{ledger="merchant_balance"} > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "商户账户余额与账本不一致"
          description: "有 {{ $value }} 个商户账户与最新账本六项结余不一致或尚未初始化账本，请冻结相关人工资金操作并执行只读对账。"
